name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release type
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      prerelease:
        description: Prerelease type
        required: true
        default: none
        type: choice
        options:
          - none
          - alpha
          - beta
          - rc

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure stable release is running from master
        if: ${{ inputs.prerelease == 'none' }}
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "Stable release is allowed only from master. Current ref: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Setup Node.js for release
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Show Docker Compose version
        run: docker compose version

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release checks
        run: |
          make lint
          make typecheck
          make test

      - name: Run release script
        env:
          RELEASE_TYPE: ${{ inputs.release }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          case "$RELEASE_TYPE" in
            auto)
              RELEASE_SCRIPT="release"
              ;;
            patch)
              RELEASE_SCRIPT="release:patch"
              ;;
            minor)
              RELEASE_SCRIPT="release:minor"
              ;;
            major)
              RELEASE_SCRIPT="release:major"
              ;;
            *)
              echo "Unknown release type: $RELEASE_TYPE"
              exit 1
              ;;
          esac

          if [ "$PRERELEASE" = "none" ]; then
            yarn run "$RELEASE_SCRIPT"
          else
            yarn run "$RELEASE_SCRIPT" --prerelease "$PRERELEASE"
          fi

      - name: Build package
        run: make build

      - name: Push release commit and tags
        run: git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Publish package to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          NPM_TAG=$(node -e "const semver = require('semver'); const manifest = require('./package.json'); const prerelease = semver.prerelease(manifest.version); process.stdout.write(prerelease && typeof prerelease[0] === 'string' ? prerelease[0] : 'latest')")

          npm publish --tag "$NPM_TAG"
